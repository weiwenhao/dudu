name: release

# The release bot (owner, 2026-11-19). Push a tag `v<version>`, where <version> is the one in host/dudu-plugin/package.json
# (v0.1.0, say), on a commit that is on main. It then packages the plugin, builds a signed Android APK, makes the GitHub release
# with both, and publishes the plugin to npm.
# Started by hand from the Actions tab, it builds the same files and keeps them as artifacts of the run, and publishes nothing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the history of main, to see that a tag is on it

      - name: Check the tag
        id: version
        run: |
          version=$(jq -r .version host/dudu-plugin/package.json)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::The tag is $GITHUB_REF_NAME, but host/dudu-plugin/package.json says $version: the tag has to be v$version."
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::The tagged commit is not on main. Releases only come from main."
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install the repository
        run: npm ci

      # npm puts a LICENSE and a README found in the package folder into the package; they live at the root of the repository.
      - name: Add the licence and the README to the package
        run: cp LICENSE README.md host/dudu-plugin/

      - name: Package the plugin
        run: npm run package:desktop

      - name: Check what npm would publish
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npm publish ".local/release/dsh-dudu-${VERSION}.tgz" --dry-run --access public --tag latest

      # Only the npm package is kept: it is what the release and npm publish. The zip and whatever else the script leaves in that folder stay out.
      - name: Keep the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin
          path: .local/release/dsh-dudu-${{ steps.version.outputs.version }}.tgz
          if-no-files-found: error
          retention-days: 14

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # The key is a secret of the repository (DUDU_KEYSTORE_BASE64 and the three next to it). A build that cannot be signed stops here:
      # an unsigned APK cannot be installed, and one signed with another key could never update the first.
      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.DUDU_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The repository has no DUDU_KEYSTORE_BASE64 secret, so the APK cannot be signed."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dudu-release.jks"
          echo "DUDU_KEYSTORE_FILE=$RUNNER_TEMP/dudu-release.jks" >> "$GITHUB_ENV"

      - name: Build the release APK
        working-directory: native/android
        env:
          DUDU_KEYSTORE_PASSWORD: ${{ secrets.DUDU_KEYSTORE_PASSWORD }}
          DUDU_KEY_ALIAS: ${{ secrets.DUDU_KEY_ALIAS }}
          DUDU_KEY_PASSWORD: ${{ secrets.DUDU_KEY_PASSWORD }}
          DUDU_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleRelease --console=plain

      - name: Check the signature
        run: |
          version=$(jq -r .version host/dudu-plugin/package.json)
          apk=$(ls native/android/app/build/outputs/apk/release/*.apk)
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$apksigner" verify --verbose --print-certs "$apk"
          mkdir out
          cp "$apk" "out/dudu-android-${version}.apk"

      - name: Keep the APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: out/*.apk
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.ref_type == 'tag'
    needs: [plugin, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # The text of the page is made by scripts/release-body.mjs from release-notes/<version>.md; the history gives it the link to the full list of changes.
      - name: Check out the release text
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          sparse-checkout: |
            scripts/release-body.mjs
            release-notes/
          sparse-checkout-cone-mode: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Get the packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets
          merge-multiple: true

      - name: Make the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plugin.outputs.version }}
        run: |
          # A run that is repeated (a job that failed, and was started again) finds the release it made before.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "The release $GITHUB_REF_NAME exists already. Nothing to make."
            exit 0
          fi
          # The install lines at the top of every release (owner, 2026-11-23; the App Store and the latest TestFlight version, 2026-11-26), then what changed:
          # release-notes/<version>.md, both languages, written and reviewed before the tag (scripts/release-body.mjs).
          notes=$(node scripts/release-body.mjs "$VERSION" "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY")
          args=(--repo "$GITHUB_REPOSITORY" --verify-tag --notes "$notes")
          # Without that file, the list that GitHub generates follows the install lines.
          [ -f "release-notes/${VERSION}.md" ] || args+=(--generate-notes)
          # A version with a hyphen (0.2.0-rc.1, say) is a pre-release.
          case "$VERSION" in *-*) args+=(--prerelease) ;; esac
          cd assets
          gh release create "$GITHUB_REF_NAME" "${args[@]}" ./*

  npm:
    if: github.ref_type == 'tag'
    needs: plugin
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # No token: npm trusts this workflow (trusted publishing, set on the package's page at npmjs.com), and records where the package was built.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer.
      - name: Install a recent npm
        run: npm install --global npm@11.21.3

      - name: Get the package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin
          path: assets

      # A version cannot be published twice; a run that is repeated, or a version that was published by hand first, passes.
      # The beta is `latest` on purpose: DSH's "Add plugin" installs what `latest` points to, and a package with no `latest` cannot be added by name.
      - name: Publish to npm
        env:
          VERSION: ${{ needs.plugin.outputs.version }}
        run: |
          if npm view "dsh-dudu@${VERSION}" version > /dev/null 2>&1; then
            echo "dsh-dudu@${VERSION} is on npm already. Nothing to publish."
            exit 0
          fi
          # `./`: without it npm reads assets/<file>.tgz as the GitHub shorthand owner/repo.
          npm publish "./assets/dsh-dudu-${VERSION}.tgz" --provenance --access public --tag latest

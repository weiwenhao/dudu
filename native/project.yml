name: DSBotNative
options:
  bundleIdPrefix: com.harnessmobile
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: S3549488QR
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: 49
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
packages:
  LucideSwift:
    url: https://github.com/ajaxjiang96/lucide-swift.git
    exactVersion: 0.9.18
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui.git
    exactVersion: 2.4.1
targets:
  dsbot:
    type: application
    platform: iOS
    sources:
      - path: DSBot
        excludes:
          - Info.plist
    dependencies:
      - package: LucideSwift
      - package: MarkdownUI
    settings:
      base:
        PRODUCT_NAME: dsbot
        PRODUCT_BUNDLE_IDENTIFIER: com.harnessmobile.app
        INFOPLIST_KEY_CFBundleDisplayName: Dudu
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: DSBot/Info.plist
  dsbotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - DSBotTests
    dependencies:
      - target: dsbot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.harnessmobile.app.Tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  dsbot:
    build:
      targets:
        dsbot: all
    test:
      targets:
        - dsbotTests

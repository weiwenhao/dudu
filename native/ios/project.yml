name: Dudu
options:
  bundleIdPrefix: com.harnessmobile
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
settings:
  base:
    DEVELOPMENT_TEAM: S3549488QR
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: 143
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    DUDU_APNS_ENVIRONMENT: development
packages:
  LucideSwift:
    url: https://github.com/ajaxjiang96/lucide-swift.git
    exactVersion: 0.9.18
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui.git
    exactVersion: 2.4.1
targets:
  Dudu:
    type: application
    platform: iOS
    entitlements:
      path: Dudu/Dudu.entitlements
      properties:
        aps-environment: "$(DUDU_APNS_ENVIRONMENT)"
    sources:
      - path: Dudu
        excludes:
          - Info.plist
    dependencies:
      - package: LucideSwift
      - package: MarkdownUI
    settings:
      base:
        PRODUCT_NAME: Dudu
        PRODUCT_BUNDLE_IDENTIFIER: com.harnessmobile.app
        INFOPLIST_KEY_CFBundleDisplayName: Dudu
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Dudu/Info.plist
  DuduTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - DuduTests
    dependencies:
      - target: Dudu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.harnessmobile.app.Tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Dudu:
    build:
      targets:
        Dudu: all
    test:
      targets:
        - DuduTests
